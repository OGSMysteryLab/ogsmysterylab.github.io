name: Update episodes from YouTube

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the channel feed and merge into episodes.json
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCoySACBPKhFYyq_iJarS3UA"
          FEED = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL_ID
          NS = {
              "a": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015",
          }

          def slug(title):
              s = title.lower()
              s = re.sub(r"[^a-z0-9]+", "-", s).strip("-")
              return s[:50] or "episode"

          def clean_title(title):
              # Hashtags horen in de YouTube-titel, niet op de bronnensite.
              t = title.split("#")[0]
              return re.sub(r"[\s|\u2013-]+$", "", t).strip() or title.strip()

          def video_length(vid):
              # Lengte in seconden van de watch-pagina; None als dat niet lukt (dan blijft het veld leeg).
              try:
                  req = urllib.request.Request("https://www.youtube.com/watch?v=" + vid,
                                               headers={"User-Agent": "ogs-sources-bot", "Accept-Language": "en"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      html = r.read().decode("utf-8", "ignore")
                  m = re.search(r'"lengthSeconds":"(\d+)"', html)
                  return int(m.group(1)) if m else None
              except Exception:
                  return None

          def guess_format(title):
              t = title.lower().strip()
              if t.startswith("what if"):
                  return "WHATIF"
              if t.startswith(("did ", "was ", "were ", "is ", "are ", "do ", "does ", "can ", "could ")) \
                 or "myth" in t or "really" in t:
                  return "MYTH"
              return "FACT"

          req = urllib.request.Request(FEED, headers={"User-Agent": "ogs-sources-bot"})
          with urllib.request.urlopen(req, timeout=30) as r:
              tree = ET.fromstring(r.read())

          feed = []
          for entry in tree.findall("a:entry", NS):
              vid = entry.findtext("yt:videoId", default="", namespaces=NS)
              title = (entry.findtext("a:title", default="", namespaces=NS) or "").strip()
              published = (entry.findtext("a:published", default="", namespaces=NS) or "")[:10]
              if vid and title:
                  feed.append({"video": vid, "title": title, "date": published})
          feed.sort(key=lambda e: e["date"])

          path = "episodes.json"
          existing = []
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  existing = json.load(f)

          by_video = {e.get("video"): e for e in existing if e.get("video")}
          used_slugs = {e.get("id") for e in existing}
          max_ep = max([e.get("ep", 0) for e in existing] or [0])

          added = 0
          filled = 0
          for item in feed:
              cur = by_video.get(item["video"])
              if cur:
                  # Bestaande regels worden met de hand bijgehouden: titel, claim, oordeel en bronnen.
                  # De feed vult hier alleen nog lege velden op en overschrijft nooit iets wat er al staat.
                  # (YouTube kapt titels in de RSS-feed af op 100 tekens; zonder deze regel werd een
                  #  handmatig ingevulde titel elke zes uur vervangen door de afgekapte versie.)
                  for key, value in (
                      ("title", item["title"]),
                      ("date", item["date"]),
                      ("youtube", "https://www.youtube.com/watch?v=" + item["video"]),
                  ):
                      if value and not cur.get(key):
                          cur[key] = value
                          filled += 1
                  continue
              item["title"] = clean_title(item["title"])
              base = slug(item["title"])
              sid, n = base, 2
              while sid in used_slugs:
                  sid, n = base + "-" + str(n), n + 1
              used_slugs.add(sid)
              max_ep += 1
              new = {
                  "id": sid,
                  "video": item["video"],
                  "ep": max_ep,
                  "format": guess_format(item["title"]),
                  "title": item["title"],
                  "claim": "",
                  "verdict": "",
                  "date": item["date"],
                  "youtube": "https://www.youtube.com/watch?v=" + item["video"],
                  "sources": [],
              }
              secs = video_length(item["video"])
              if secs and secs > 185:
                  # Lange video: eigen kaart met de lengte erbij, zoals bij Attila en de Göktürks.
                  new["format"] = "LONG"
                  new["duration"] = str(max(1, round(secs / 60))) + " MIN"
              existing.append(new)
              by_video[item["video"]] = new
              added += 1

          # Lange video's zonder lengte (met de hand op LONG gezet) krijgen die er alsnog bij.
          for e in existing:
              if e.get("format") == "LONG" and not e.get("duration") and e.get("video"):
                  secs = video_length(e["video"])
                  if secs:
                      e["duration"] = str(max(1, round(secs / 60))) + " MIN"
                      filled += 1

          existing.sort(key=lambda e: int(e.get("ep", 0) or 0), reverse=True)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("new episodes added:", added, "| empty fields filled:", filled, "| total:", len(existing))
          PY

      - name: Commit when something changed
        run: |
          if [ -n "$(git status --porcelain episodes.json)" ]; then
            git config user.name "OGS sources bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add episodes.json
            git commit -m "Update episodes from the YouTube feed"
            git push
          else
            echo "Nothing changed."
          fi
