<style>
:root{
  --bg:#0A100D; --panel:#111C17; --panel2:#16241D;
  --ink:#ECF3EE; --ink2:#AFC0B6; --ink3:#7A8C83;
  --line:#223129; --line2:#2E4036;
  --green:#35D07F; --red:#FF6B5A; --yellow:#F5D90A; --yellow-ink:#1A1600;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(760px 420px at 12% -6%,rgba(53,208,127,.16),transparent 60%),
             radial-gradient(620px 360px at 88% 4%,rgba(245,217,10,.09),transparent 60%),var(--bg);
  background-attachment:fixed;padding-inline:clamp(16px,5vw,24px);padding-block:0 56px}
a{color:var(--green);text-underline-offset:3px}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto}

header{display:flex;align-items:center;gap:11px;padding-block:22px 18px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 0 0 1px rgba(245,217,10,.35),0 9px 28px -14px rgba(245,217,10,.9)}
.mark svg{width:80%;height:80%;display:block}
header b{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}
header span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-top:2px}

/* intro */
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1;letter-spacing:-.022em;margin:14px 0 0;text-wrap:balance}
h1 .hl{position:relative;z-index:0;color:var(--yellow-ink);padding:0 .16em;white-space:nowrap}
h1 .hl::before{content:"";position:absolute;z-index:-1;inset:-.03em -.05em -.11em;background:var(--yellow);
  border-radius:2px 6px 3px 7px/7px 3px 7px 2px;transform:rotate(-.8deg);
  box-shadow:0 14px 42px -16px rgba(245,217,10,.9)}
.kick{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(53,208,127,.55);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2.4s ease-out infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,208,127,.55)}70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}}
.lede{color:var(--ink2);margin:14px 0 0;max-width:46ch}
.start{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.btn{position:relative;display:inline-flex;align-items:center;gap:11px;cursor:pointer;border:0;
  background:linear-gradient(135deg,#FFE94A 0%,var(--yellow) 46%,#E0C400 100%);color:var(--yellow-ink);
  border-radius:999px;padding:15px 22px 15px 26px;font-weight:700;font-size:16px;letter-spacing:-.01em;
  box-shadow:0 0 0 1px rgba(245,217,10,.55),0 14px 34px -14px rgba(245,217,10,.95),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.btn .arrow{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:rgba(26,22,0,.14);font-size:14px;line-height:1;transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(245,217,10,.7),0 20px 44px -14px rgba(245,217,10,1),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:hover .arrow{transform:translateX(3px)}
.btn:active{transform:translateY(0)}
.note{font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.04em}

/* quiz */
.bar{display:flex;gap:4px;margin:20px 0 18px}
.bar i{flex:1;height:4px;border-radius:2px;background:var(--line2);transition:background .25s}
.bar i.done{background:var(--green)}
.bar i.wrong{background:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:24px 22px}
.qn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.claim{font-family:var(--display);font-weight:700;font-size:clamp(21px,4.6vw,27px);line-height:1.18;letter-spacing:-.012em;margin:10px 0 22px;text-wrap:balance}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.choice{position:relative;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;
  padding:16px 12px;font-weight:600;cursor:pointer;overflow:hidden;
  transition:border-color .18s,color .18s,transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.choice::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .18s;
  background:radial-gradient(120% 130% at 50% 120%, rgba(53,208,127,.20), transparent 62%)}
.choice:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(53,208,127,.9)}
.choice:hover::after{opacity:1}

.reveal{margin-top:20px;border-top:1px dashed var(--line2);padding-top:16px}
.verdict{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;padding:5px 10px;border-radius:6px}
.verdict.ok{background:rgba(53,208,127,.15);color:var(--green);border:1px solid rgba(53,208,127,.4)}
.verdict.no{background:rgba(255,107,90,.13);color:var(--red);border:1px solid rgba(255,107,90,.4)}
.truth{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--yellow);margin:13px 0 8px}
.expl{color:var(--ink2);font-size:15px}
.srcline{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:11px}
.watch{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em;text-decoration:none;color:var(--yellow);border:1px solid var(--yellow);border-radius:999px;padding:9px 15px}
.watch:hover{background:var(--yellow);color:#1A1600}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em;margin-top:12px}
html.embed .kbd{display:none}
.next{margin-top:18px;background:transparent;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer}
.next:hover{border-color:var(--green);color:var(--green)}

/* result */
.score{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,54px);line-height:1;letter-spacing:-.02em;margin:6px 0 0}
.score em{font-style:normal;color:var(--yellow)}
.verdicttxt{color:var(--ink2);margin-top:14px;max-width:44ch}
.grid{font-family:var(--mono);font-size:22px;letter-spacing:2px;margin:20px 0 4px;word-break:break-word}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:13px 18px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.ghost:hover{border-color:var(--green);color:var(--green)}
.recap{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.recap h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 0 12px}
.r{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.r:first-of-type{border-top:0}
.r .dot{font-size:13px}
.r .t{font-size:14.5px;color:var(--ink2)}
.r .t b{color:var(--ink);font-weight:600}
.r .t a{font-family:var(--mono);font-size:11px}
footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px}
@media (prefers-reduced-motion:no-preference){.card,.choice,.btn{transition:border-color .2s,color .2s,filter .2s}}

/* ingesloten op de voorpagina: geen eigen kop, geen eigen achtergrond, geen dubbele marge */
html.embed body{padding-inline:0;padding-block:0;background:none}
html.embed header,html.embed footer{display:none}
html.embed .wrap{max-width:none}
html.embed h1{font-size:clamp(19px,3.6vw,23px);margin-top:0;line-height:1.08}
html.embed .lede{font-size:13px;margin-top:8px}
html.embed .kick{font-size:10px;letter-spacing:.12em}
html.embed .start{margin-top:13px}
html.embed .card{padding:15px 15px}
html.embed .claim{font-size:clamp(17px,2.5vw,21px)}
html.embed .bar{margin-bottom:12px}
/* op een breed scherm staat de startknop naast de tekst, anders blijft de halve breedte leeg */
@media (min-width:720px){
  html.embed #app:has(.start){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:28px}
  html.embed #app:has(.start) .kick{grid-column:1;margin:0}
  html.embed #app:has(.start) h1{grid-column:1;margin:6px 0 0}
  html.embed #app:has(.start) .lede{grid-column:1;margin-top:9px;max-width:52ch}
  html.embed #app:has(.start) .start{grid-column:2;grid-row:1 / span 3;margin-top:0;align-items:center;text-align:center}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><clipPath id="ogsdisht"><circle cx="50" cy="50" r="31.6"/></clipPath></defs><circle cx="50" cy="50" r="31.6" fill="#111B2E"/><g clip-path="url(#ogsdisht)"><rect x="0" y="58.6" width="100" height="4" fill="#7FFF74"/><rect x="0" y="62.6" width="100" height="40" fill="#3DFF2E"/></g><circle cx="40.4" cy="29.3" r="3.7" fill="none" stroke="#3DFF2E" stroke-width="3.1"/><circle cx="56.3" cy="41" r="6.1" fill="none" stroke="#3DFF2E" stroke-width="4.6"/><circle cx="40.2" cy="67.8" r="2.3" fill="#217D26"/><circle cx="62.1" cy="73.8" r="1.8" fill="#269527"/></svg></div>
    <div><b>OGS Mystery Lab</b><span>Every claim, sourced</span></div>
  </header>
  <main id="app"></main>
  <footer id="foot" hidden>Every answer above is checked against a named source. The full list lives at <a href="https://ogsmysterylab.github.io" target="_blank" rel="noopener">ogsmysterylab.github.io</a>.</footer>
</div>

<script>
const Q = [
  {c:"You only use 10% of your brain.", myth:true,
   truth:"BUSTED",
   e:"Imaging shows activity across the whole brain, even in sleep. It is 2% of your body weight and burns about 20% of your resting energy — evolution would not pay that for dead tissue.",
   s:"University of Washington, Neuroscience for Kids", u:"https://faculty.washington.edu/chudler/tenper.html"},

  {c:"The Great Wall of China is visible from space with the naked eye.", myth:true,
   truth:"BUSTED",
   e:"From the Moon it would be like spotting a human hair from a kilometre away. China's first astronaut confirmed in 2003 that he could not see it from orbit either.",
   s:"NASA History Office", u:"https://www.nasa.gov/wp-content/uploads/static/history/PDFs/great_wall_less_great_from_space.pdf"},

  {c:"Goldfish forget everything after three seconds.", myth:true,
   truth:"BUSTED",
   e:"Goldfish still solved a maze faster than on their last training day after a six-month gap. No scientific source has ever stated the three-second figure.",
   s:"American Museum of Natural History", u:"https://www.amnh.org/learn-teach/curriculum-collections/young-naturalist-awards"},

  {c:"Bulls charge because they see red.", myth:true,
   truth:"BUSTED",
   e:"Cattle are dichromats and lack the red-sensitive cone. The cape reads as dull yellow-grey — it is the movement that provokes them. Red is tradition, and it hides blood.",
   s:"West Texas A&M University", u:"https://www.wtamu.edu/~cbaird/sq/2012/12/12/what-is-it-about-red-that-makes-bulls-so-angry/"},

  {c:"Lightning never strikes the same place twice.", myth:true,
   truth:"BUSTED",
   e:"Charge concentrates at tall, isolated points, so the same places get hit again and again. The Empire State Building takes roughly 23 strikes a year.",
   s:"National Weather Service (NOAA)", u:"https://www.weather.gov/safety/lightning-myths"},

  {c:"Vikings wore horned helmets.", yt:"bb0Nw6Nt8ps", ytt:"Vikings didn't have horns", myth:true,
   truth:"BUSTED",
   e:"Not one horned helmet has ever been found in a Viking grave. A costume designer put them on stage for Wagner's Ring cycle in 1876, and the image stuck for 150 years.",
   s:"National Museum of Denmark", u:"https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-viking-age/weapons/helmets/"},

  {c:"Napoleon was unusually short for his time.", yt:"CC8L0_jXpkc", ytt:"Why history got Napoleon wrong", myth:true,
   truth:"BUSTED",
   e:"He was 1.68 m — average, even slightly above it, for a Frenchman of his generation. French inches were longer than British ones, and British cartoonists did the rest.",
   s:"Fondation Napoléon", u:"https://www.napoleon.org/en/history-of-the-two-empires/articles/was-napoleon-small/"},

  {c:"There is a doorway in Turkey where bulls dropped dead and priests walked out unharmed.", yt:"-8bAhUHrkMM", ytt:"Why this cave was a death trap", myth:false,
   truth:"TRUE",
   e:"The Ploutonion at Hierapolis sits on a fault that releases carbon dioxide. It pools at ground level, so the animals suffocated while the priests' heads stayed above the gas.",
   s:"Pfanz et al., Archaeological and Anthropological Sciences", u:"https://link.springer.com/article/10.1007/s12520-018-0599-5"},

  {c:"Norse sailors reached America centuries before Columbus.", myth:false,
   truth:"TRUE",
   e:"A cosmic-ray radiocarbon spike dated Norse-cut wood in Newfoundland to exactly AD 1021 — 471 years early. Though Indigenous peoples had been there for over ten thousand years.",
   s:"Nature (2021)", u:"https://www.nature.com/articles/s41586-021-03972-8"},

  {c:"Medieval Europeans believed the Earth was flat.", myth:true,
   truth:"BUSTED",
   e:"Educated Europeans knew it was a sphere throughout the Middle Ages. Washington Irving's largely fictional 1828 life of Columbus invented the scene everyone remembers.",
   s:"Library of Congress", u:"https://guides.loc.gov/flat-earth/books"}
];

const app = document.getElementById('app');
const foot = document.getElementById('foot');
let i = 0, results = [], toets = null;
document.addEventListener('keydown', (e) => { if (toets) toets(e); });

// Deze pagina staat ook ingesloten op de voorpagina. Daar hoort geen tweede kop en geen eigen achtergrond, en moet
// het kader meegroeien met de vraag die in beeld staat — anders krijg je een scrollbalk in een scrollbalk.
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) document.documentElement.classList.add('embed');
function meldHoogte(){
  if (!EMBED) return;
  try { parent.postMessage({ogsTestHeight: Math.ceil(document.documentElement.getBoundingClientRect().height)}, '*'); } catch (e) {}
}

function intro(){
  foot.hidden = true;
  toets = null;
  app.innerHTML = `
    <div class="kick"><span class="pulse"></span>Interactive &middot; 10 statements &middot; 2 min</div>
    <h1>You believe things<br>that <span class="hl">aren't true.</span></h1>
    <p class="lede">Ten statements. Decide which are myths and which are real. Eight of them are myths — two are not. Finding those two is the hard part.</p>
    <div class="start">
      <button class="btn" id="go">Start the test <span class="arrow" aria-hidden="true">&rarr;</span></button>
      <span class="note">Takes 2 minutes · every answer is sourced</span>
    </div>`;
  document.getElementById('go').onclick = () => { i = 0; results = []; question(); };
  meldHoogte();
}

function bar(){
  return '<div class="bar">' + Q.map((_,n)=>{
    const r = results[n];
    return `<i class="${r===undefined?'':(r?'done':'wrong')}"></i>`;
  }).join('') + '</div>';
}

function question(){
  foot.hidden = true;
  const q = Q[i];
  app.innerHTML = bar() + `
    <div class="card">
      <div class="qn">Statement ${i+1} of ${Q.length}</div>
      <div class="claim">${q.c}</div>
      <div class="choices">
        <button class="choice" data-a="myth">That's a myth</button>
        <button class="choice" data-a="real">That's real</button>
      </div>
      <div class="kbd">Press 1 for myth, 2 for real</div>
    </div>`;
  app.querySelectorAll('.choice').forEach(b=>{
    b.onclick = () => answer(b.dataset.a === 'myth');
  });
  toets = (e) => {
    if (e.key === '1') answer(true);
    else if (e.key === '2') answer(false);
  };
  meldHoogte();
}

function answer(saidMyth){
  const q = Q[i];
  const right = (saidMyth === q.myth);
  results[i] = right;
  const card = app.querySelector('.card');
  app.querySelector('.choices').remove();
  const hint = app.querySelector('.kbd'); if (hint) hint.remove();
  card.insertAdjacentHTML('beforeend', `
    <div class="reveal">
      <span class="verdict ${right?'ok':'no'}">${right?'You were right':'You were wrong'}</span>
      <div class="truth">VERDICT: ${q.truth}</div>
      <p class="expl">${q.e}</p>
      <div class="srcline">Source: <a href="${q.u}" target="_blank" rel="noopener">${q.s}</a></div>
      ${q.yt ? `<div><a class="watch" href="https://www.youtube.com/watch?v=${q.yt}" target="_blank" rel="noopener">▶ Watch the episode · ${q.ytt}</a></div>` : ''}
      <button class="next" id="nx">${i === Q.length-1 ? 'See your score' : 'Next statement'}</button>
    </div>`);
  app.querySelector('.bar').replaceWith(document.createRange().createContextualFragment(bar()).firstChild);
  const verder = () => { i++; (i < Q.length) ? question() : result(); };
  document.getElementById('nx').onclick = verder;
  toets = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); verder(); } };
  meldHoogte();
}

function result(){
  const wrong = results.filter(r=>!r).length;
  const grid = results.map(r=>r?'🟩':'🟥').join('');
  let line;
  if (wrong === 0) line = "Nobody does that. You either knew them, or you guessed the two that are true.";
  else if (wrong <= 2) line = "Strong score. The two that are actually true are what catch people out.";
  else if (wrong <= 5) line = "That's the normal score. Every one of those beliefs came from somewhere traceable — usually a single book, cartoon or costume.";
  else line = "Most of what you know about these came from repetition, not evidence. That's not stupidity; it's how myths work.";

  foot.hidden = false;
  toets = null;
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({path: 'test-finished-' + wrong, title: 'Test finished', event: true});
  }
  app.innerHTML = `
    <div class="qn">Your result</div>
    <div class="score">You believed <em>${wrong}</em> of 10.</div>
    <p class="verdicttxt">${line}</p>
    <div class="grid">${grid}</div>
    <span class="note">🟩 right · 🟥 wrong</span>
    <div class="actions">
      <button class="ghost" id="copy">Share your result</button>
      <button class="ghost" id="again">Try again</button>
      <a class="ghost" href="https://ogsmysterylab.github.io" target="_blank" rel="noopener">See all the sources</a>
    </div>
    <div class="recap">
      <h3>What you got wrong</h3>
      ${results.map((r,n)=> r ? '' : `
        <div class="r"><span class="dot">🟥</span><span class="t"><b>${Q[n].c}</b><br>${Q[n].truth} — ${Q[n].e} <a href="${Q[n].u}" target="_blank" rel="noopener">source</a>${Q[n].yt ? ` · <a href="https://www.youtube.com/watch?v=${Q[n].yt}" target="_blank" rel="noopener">watch the episode</a>` : ''}</span></div>`).join('') || '<div class="r"><span class="dot">🟩</span><span class="t">Nothing. All ten correct.</span></div>'}
    </div>`;

  document.getElementById('again').onclick = intro;
  document.getElementById('copy').onclick = (e) => {
    const txt = `I believed ${wrong} of 10 myths.\n${grid}\nHow wrong are you? https://ogsmysterylab.github.io/test/`;
