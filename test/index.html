<style>
:root{
  --bg:#0A100D; --panel:#111C17; --panel2:#16241D;
  --ink:#ECF3EE; --ink2:#AFC0B6; --ink3:#7A8C83;
  --line:#223129; --line2:#2E4036;
  --green:#35D07F; --red:#FF6B5A; --yellow:#F5D90A; --yellow-ink:#1A1600;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(760px 420px at 12% -6%,rgba(53,208,127,.16),transparent 60%),
             radial-gradient(620px 360px at 88% 4%,rgba(245,217,10,.09),transparent 60%),var(--bg);
  background-attachment:fixed;padding-inline:clamp(16px,5vw,24px);padding-block:0 56px}
a{color:var(--green);text-underline-offset:3px}
button{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto}

header{display:flex;align-items:center;gap:11px;padding-block:22px 18px}
.mark{width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  filter:drop-shadow(0 0 20px rgba(61,255,46,.26)) drop-shadow(0 6px 16px rgba(0,0,0,.5))}
.mark svg{width:100%;height:100%;display:block}
header b{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}
header span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-top:2px}

/* intro */
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1;letter-spacing:-.022em;margin:14px 0 0;text-wrap:balance}
h1 .hl{position:relative;z-index:0;color:var(--yellow-ink);padding:0 .18em;white-space:nowrap}
h1 .hl::before{content:"";position:absolute;z-index:-1;inset:.04em -.02em .08em;background:var(--yellow);
  border-radius:3px;box-shadow:0 12px 38px -18px rgba(245,217,10,.95)}
.kick{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(53,208,127,.55);flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2.4s ease-out infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,208,127,.55)}70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}}
.lede{color:var(--ink2);margin:14px 0 0;max-width:46ch}
.start{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.btn{position:relative;display:inline-flex;align-items:center;gap:11px;cursor:pointer;border:0;
  background:linear-gradient(135deg,#FFE94A 0%,var(--yellow) 46%,#E0C400 100%);color:var(--yellow-ink);
  border-radius:999px;padding:15px 22px 15px 26px;font-weight:700;font-size:16px;letter-spacing:-.01em;
  box-shadow:0 0 0 1px rgba(245,217,10,.55),0 14px 34px -14px rgba(245,217,10,.95),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.btn .arrow{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:rgba(26,22,0,.14);font-size:14px;line-height:1;transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(245,217,10,.7),0 20px 44px -14px rgba(245,217,10,1),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:hover .arrow{transform:translateX(3px)}
.btn:active{transform:translateY(0)}
.note{font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.04em}

/* quiz */
.bar{display:flex;gap:4px;margin:20px 0 18px}
.bar i{flex:1;height:4px;border-radius:2px;background:var(--line2);transition:background .25s}
.bar i.done{background:var(--green)}
.bar i.wrong{background:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:24px 22px}
.qn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.claim{font-family:var(--display);font-weight:700;font-size:clamp(21px,4.6vw,27px);line-height:1.18;letter-spacing:-.012em;margin:10px 0 22px;text-wrap:balance}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.choice{position:relative;background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;
  padding:16px 12px;font-weight:600;cursor:pointer;overflow:hidden;
  transition:border-color .18s,color .18s,transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.choice::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .18s;
  background:radial-gradient(120% 130% at 50% 120%, rgba(53,208,127,.20), transparent 62%)}
.choice:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(53,208,127,.9)}
.choice:hover::after{opacity:1}

.reveal{margin-top:20px;border-top:1px dashed var(--line2);padding-top:16px}
.verdict{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;padding:5px 10px;border-radius:6px}
.verdict.ok{background:rgba(53,208,127,.15);color:var(--green);border:1px solid rgba(53,208,127,.4)}
.verdict.no{background:rgba(255,107,90,.13);color:var(--red);border:1px solid rgba(255,107,90,.4)}
.truth{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--yellow);margin:13px 0 8px}
.expl{color:var(--ink2);font-size:15px}
.srcline{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:11px}
.watch{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em;text-decoration:none;color:var(--yellow);border:1px solid var(--yellow);border-radius:999px;padding:9px 15px}
.watch:hover{background:var(--yellow);color:#1A1600}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em;margin-top:12px}
html.embed .kbd{display:none}
.next{margin-top:18px;background:transparent;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer}
.next:hover{border-color:var(--green);color:var(--green)}

/* result */
.score{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,54px);line-height:1;letter-spacing:-.02em;margin:6px 0 0}
.score em{font-style:normal;color:var(--yellow)}
.breakdown{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bd{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid var(--line2);border-radius:999px;padding:7px 13px;color:var(--ink2);background:var(--panel)}
.bd b{font-weight:700}
.bd.miss{border-color:rgba(255,107,90,.4);color:var(--red)}
.bd.good{border-color:rgba(53,208,127,.4);color:var(--green)}
.verdicttxt{color:var(--ink2);margin-top:14px;max-width:46ch}

/* iemand daagde je uit */
.challenge{display:flex;align-items:flex-start;gap:12px;margin-top:18px;padding:13px 15px;
  border:1px solid var(--line2);border-left:3px solid var(--yellow);border-radius:12px;background:var(--panel)}
.challenge .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--yellow);line-height:1.1;flex:0 0 auto}
.challenge .t{font-size:14px;color:var(--ink2)}
.challenge .t b{color:var(--ink);font-weight:600}

/* delen */
.sharebox{margin-top:14px;border:1px solid var(--line2);border-radius:13px;background:var(--panel);padding:15px 16px}
.sharetxt{font-family:var(--mono);font-size:12.5px;color:var(--ink2);line-height:1.6;
  border-left:2px solid var(--line2);padding-left:12px;margin-bottom:14px;word-break:break-word}
.shareopts{display:flex;gap:9px;flex-wrap:wrap}
.sopt{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;font-weight:600;
  border:1px solid var(--line2);border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;
  background:var(--panel2);color:var(--ink);transition:border-color .16s,color .16s,transform .16s}
.sopt:hover{transform:translateY(-1px);border-color:var(--green);color:var(--green)}
.sopt.wa:hover{border-color:#4FE07A;color:#4FE07A}
.sopt svg{width:15px;height:15px;display:block}
.livemsg{font-family:var(--mono);font-size:11.5px;color:var(--green);margin:12px 0 0;min-height:1.2em}
.livemsg:empty{margin:0;min-height:0}

/* socials */
.socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.soc{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:600;
  text-decoration:none;color:var(--ink2);border:1px solid var(--line2);background:var(--panel);
  border-radius:999px;padding:9px 14px 9px 11px;white-space:nowrap;
  transition:transform .16s,border-color .16s,color .16s,box-shadow .16s}
.soc .ico{display:grid;place-items:center;width:15px;height:15px;color:var(--ink3);transition:color .16s}
.soc .ico svg{width:100%;height:100%;display:block}
.soc:hover{transform:translateY(-2px);color:var(--ink)}
.soc.yt:hover{border-color:#FF4D4D;box-shadow:0 8px 22px -14px #FF4D4D} .soc.yt:hover .ico{color:#FF4D4D}
.soc.ig:hover{border-color:#E56AA8;box-shadow:0 8px 22px -14px #E56AA8} .soc.ig:hover .ico{color:#E56AA8}
.soc.tt:hover{border-color:#3FE4D8;box-shadow:0 8px 22px -14px #3FE4D8} .soc.tt:hover .ico{color:#3FE4D8}
.soc.fb:hover{border-color:#5B9BFF;box-shadow:0 8px 22px -14px #5B9BFF} .soc.fb:hover .ico{color:#5B9BFF}
.socnote{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:20px 0 0}
html.embed .socials,html.embed .socnote,html.embed .challenge{display:none}
@media (max-width:420px){.soc{font-size:11.5px;padding:9px 12px 9px 10px}}
.grid{font-family:var(--mono);font-size:22px;letter-spacing:2px;margin:20px 0 4px;word-break:break-word}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:13px 18px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.ghost:hover{border-color:var(--green);color:var(--green)}
.recap{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.recap h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 0 12px}
.r{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.r:first-of-type{border-top:0}
.r .dot{font-size:13px}
.r .t{font-size:14.5px;color:var(--ink2)}
.r .t b{color:var(--ink);font-weight:600}
.r .t a{font-family:var(--mono);font-size:11px}
footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px}
@media (prefers-reduced-motion:no-preference){.card,.choice,.btn{transition:border-color .2s,color .2s,filter .2s}}

/* ingesloten op de voorpagina: geen eigen kop, geen eigen achtergrond, geen dubbele marge */
html.embed body{padding-inline:0;padding-block:0;background:none}
html.embed header,html.embed footer{display:none}
html.embed .wrap{max-width:none}
html.embed h1{font-size:clamp(19px,3.6vw,23px);margin-top:0;line-height:1.08}
html.embed .lede{font-size:13px;margin-top:8px}
html.embed .kick{font-size:10px;letter-spacing:.12em}
html.embed .start{margin-top:13px}
html.embed .card{padding:15px 15px}
html.embed .claim{font-size:clamp(17px,2.5vw,21px)}
html.embed .bar{margin-bottom:12px}
/* op een breed scherm staat de startknop naast de tekst, anders blijft de halve breedte leeg */
@media (min-width:720px){
  html.embed h1{font-size:clamp(24px,2.5vw,30px);line-height:1.14;letter-spacing:-.024em}
  html.embed #app:has(.start) h1 br{display:none}
  html.embed .lede{font-size:14px;margin-top:11px}
  html.embed #app:has(.start){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:28px}
  html.embed #app:has(.start) .kick{grid-column:1;margin:0}
  html.embed #app:has(.start) h1{grid-column:1;margin:6px 0 0}
  html.embed #app:has(.start) .lede{grid-column:1;margin-top:10px;max-width:72ch;text-wrap:pretty}
  html.embed #app:has(.start) .start{grid-column:2;grid-row:1 / span 3;margin-top:0;align-items:center;text-align:center}
}
</style>

    <div class="mark"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><clipPath id="ogsdisht"><circle cx="50" cy="50" r="31.6"/></clipPath></defs><circle cx="50" cy="50" r="45" fill="#E3DCC7"/><circle cx="50" cy="50" r="31.6" fill="#111B2E"/><g clip-path="url(#ogsdisht)"><rect x="0" y="58.6" width="100" height="4" fill="#7FFF74"/><rect x="0" y="62.6" width="100" height="40" fill="#3DFF2E"/></g><circle cx="40.4" cy="29.3" r="3.7" fill="none" stroke="#3DFF2E" stroke-width="3.1"/><circle cx="56.3" cy="41" r="6.1" fill="none" stroke="#3DFF2E" stroke-width="4.6"/><circle cx="40.2" cy="67.8" r="2.3" fill="#217D26"/><circle cx="62.1" cy="73.8" r="1.8" fill="#269527"/></svg></div>

<script>
const Q = [
  {c:"You only use 10% of your brain.", myth:true,
   truth:"BUSTED",
   e:"Imaging shows activity across the whole brain, even in sleep. It is 2% of your body weight and burns about 20% of your resting energy — evolution would not pay that for dead tissue.",
   s:"University of Washington, Neuroscience for Kids", u:"https://faculty.washington.edu/chudler/tenper.html"},

  {c:"The Great Wall of China is visible from space with the naked eye.", myth:true,
   truth:"BUSTED",
   e:"From the Moon it would be like spotting a human hair from a kilometre away. China's first astronaut confirmed in 2003 that he could not see it from orbit either.",
   s:"NASA History Office", u:"https://www.nasa.gov/wp-content/uploads/static/history/PDFs/great_wall_less_great_from_space.pdf"},

  {c:"Goldfish forget everything after three seconds.", myth:true,
   truth:"BUSTED",
   e:"Goldfish still solved a maze faster than on their last training day after a six-month gap. No scientific source has ever stated the three-second figure.",
   s:"American Museum of Natural History", u:"https://www.amnh.org/learn-teach/curriculum-collections/young-naturalist-awards"},

  {c:"Bulls charge because they see red.", myth:true,
   truth:"BUSTED",
   e:"Cattle are dichromats and lack the red-sensitive cone. The cape reads as dull yellow-grey — it is the movement that provokes them. Red is tradition, and it hides blood.",
   s:"West Texas A&M University", u:"https://www.wtamu.edu/~cbaird/sq/2012/12/12/what-is-it-about-red-that-makes-bulls-so-angry/"},

  {c:"Lightning never strikes the same place twice.", myth:true,
   truth:"BUSTED",
   e:"Charge concentrates at tall, isolated points, so the same places get hit again and again. The Empire State Building takes roughly 23 strikes a year.",
   s:"National Weather Service (NOAA)", u:"https://www.weather.gov/safety/lightning-myths"},

  {c:"Vikings wore horned helmets.", yt:"bb0Nw6Nt8ps", ytt:"Vikings didn't have horns", myth:true,
   truth:"BUSTED",
   e:"Not one horned helmet has ever been found in a Viking grave. A costume designer put them on stage for Wagner's Ring cycle in 1876, and the image stuck for 150 years.",
   s:"National Museum of Denmark", u:"https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-viking-age/weapons/helmets/"},

  {c:"Napoleon was unusually short for his time.", yt:"CC8L0_jXpkc", ytt:"Why history got Napoleon wrong", myth:true,
   truth:"BUSTED",
   e:"He was 1.68 m — average, even slightly above it, for a Frenchman of his generation. French inches were longer than British ones, and British cartoonists did the rest.",
   s:"Fondation Napoléon", u:"https://www.napoleon.org/en/history-of-the-two-empires/articles/was-napoleon-small/"},

  {c:"There is a doorway in Turkey where bulls dropped dead and priests walked out unharmed.", yt:"-8bAhUHrkMM", ytt:"Why this cave was a death trap", myth:false,
   truth:"TRUE",
   e:"The Ploutonion at Hierapolis sits on a fault that releases carbon dioxide. It pools at ground level, so the animals suffocated while the priests' heads stayed above the gas.",
   s:"Pfanz et al., Archaeological and Anthropological Sciences", u:"https://link.springer.com/article/10.1007/s12520-018-0599-5"},

  {c:"Norse sailors reached America centuries before Columbus.", myth:false,
   truth:"TRUE",
   e:"A cosmic-ray radiocarbon spike dated Norse-cut wood in Newfoundland to exactly AD 1021 — 471 years early. Though Indigenous peoples had been there for over ten thousand years.",
   s:"Nature (2021)", u:"https://www.nature.com/articles/s41586-021-03972-8"},

  {c:"Medieval Europeans believed the Earth was flat.", myth:true,
   truth:"BUSTED",
   e:"Educated Europeans knew it was a sphere throughout the Middle Ages. Washington Irving's largely fictional 1828 life of Columbus invented the scene everyone remembers.",
   s:"Library of Congress", u:"https://guides.loc.gov/flat-earth/books"}
];

const app = document.getElementById('app');
const foot = document.getElementById('foot');
let i = 0, results = [], answers = [], toets = null, begonnen = false;

const SITE  = 'https://ogsmysterylab.github.io';
const TEST  = SITE + '/test/';
const WOORD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const hoofdletter = (t) => t.charAt(0).toUpperCase() + t.slice(1);

// De score van wie jou uitdaagde komt uit de URL en is dus onbetrouwbaar.
// Alleen een heel getal 0 t/m 10 wordt geaccepteerd; al het andere wordt genegeerd.
function uitdagerScore(){
  const ruw = new URLSearchParams(location.search).get('s');
  if (ruw === null || !/^\d{1,2}$/.test(ruw)) return null;
  const n = Number(ruw);
  return (Number.isInteger(n) && n >= 0 && n <= Q.length) ? n : null;
}

const SOCIALS = [
  ['yt','YouTube',  'https://www.youtube.com/channel/UCoySACBPKhFYyq_iJarS3UA',
   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.5 8.6v6.8l6-3.4-6-3.4z"/><path d="M12 4.2c3.1 0 5.6.2 6.8.4 1 .2 1.8 1 2 2 .2 1.1.3 2.7.3 5.4s-.1 4.3-.3 5.4c-.2 1-1 1.8-2 2-1.2.2-3.7.4-6.8.4s-5.6-.2-6.8-.4c-1-.2-1.8-1-2-2C3 16.3 3 14.7 3 12s.1-4.3.3-5.4c.2-1 1-1.8 2-2 1.2-.2 3.6-.4 6.7-.4zm0 1.8c-3 0-5.3.2-6.4.4-.3 0-.5.3-.6.6-.1.8-.2 2.3-.2 5s.1 4.2.2 5c0 .3.3.5.6.6 1.1.2 3.4.4 6.4.4s5.3-.2 6.4-.4c.3 0 .5-.3.6-.6.1-.8.2-2.3.2-5s-.1-4.2-.2-5c0-.3-.3-.5-.6-.6-1.1-.2-3.4-.4-6.4-.4z"/></svg>'],
  ['ig','Instagram','https://www.instagram.com/ogsmysterylab/',
   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.9" r="1.15" fill="currentColor" stroke="none"/></svg>'],
  ['tt','TikTok',   'https://www.tiktok.com/@ogsmysterylab',
   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 3h2.4c.2 1.6 1.1 3 2.5 3.7.7.4 1.5.6 2.3.6v2.5c-1.7 0-3.3-.5-4.7-1.5v6.4c0 3.2-2.6 5.8-5.8 5.8S5 17.9 5 14.7 7.6 8.9 10.7 8.9c.3 0 .6 0 .9.1v2.6a3.3 3.3 0 1 0 2.4 3.1V3z"/></svg>'],
  ['fb','Facebook', 'https://www.facebook.com/ogsmysterylab1/',
   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.6 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5 1.55-1.5h1.65V3.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.45-4 4.1v2.3H7.7V13h2.7v8h3.2z"/></svg>'],
];

function socialsHTML(kop){
  return `<p class="socnote">${kop}</p><nav class="socials" aria-label="OGS Mystery Lab on social media">` +
    SOCIALS.map(([k,naam,url,ic]) =>
      `<a class="soc ${k}" href="${url}" target="_blank" rel="noopener"><span class="ico">${ic}</span>${naam}</a>`
    ).join('') + '</nav>';
}
document.addEventListener('keydown', (e) => { if (toets) toets(e); });

// Deze pagina staat ook ingesloten op de voorpagina. Daar hoort geen tweede kop en geen eigen achtergrond, en moet
// het kader meegroeien met de vraag die in beeld staat — anders krijg je een scrollbalk in een scrollbalk.
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) document.documentElement.classList.add('embed');
function meldHoogte(){
  if (!EMBED) return;
  try { parent.postMessage({ogsTestHeight: Math.ceil(document.documentElement.getBoundingClientRect().height)}, '*'); } catch (e) {}
}

function intro(){
  foot.hidden = true;
  toets = null;
  const uit = begonnen ? null : uitdagerScore();
  const uitdaging = uit === null ? '' : `
    <div class="challenge">
      <div class="n">${uit}/${Q.length}</div>
      <div class="t">Someone scored <b>${uit} out of ${Q.length}</b> and passed this on to you.
      That is their score, not yours — your ten statements are still unanswered.</div>
    </div>`;
  app.innerHTML = `
    <div class="kick"><span class="pulse"></span>Interactive &middot; 10 statements &middot; 2 min</div>
    <h1>You believe things<br> that <span class="hl">aren’t true.</span></h1>
    <p class="lede">Ten statements. Decide which are myths and which are real. Eight of them are myths — two are not. Finding those two is the hard part.</p>
    ${uitdaging}
    <div class="start">
      <button class="btn" id="go">${uit === null ? 'Start the test' : 'Start your own test'} <span class="arrow" aria-hidden="true">&rarr;</span></button>
      <span class="note">Takes 2 minutes · no account · every answer is sourced</span>
    </div>
    ${socialsHTML('More from OGS Mystery Lab')}`;
  document.getElementById('go').onclick = () => { begonnen = true; i = 0; results = []; answers = []; question(); };
  meldHoogte();
}

function bar(){
  return '<div class="bar">' + Q.map((_,n)=>{
    const r = results[n];
    return `<i class="${r===undefined?'':(r?'done':'wrong')}"></i>`;
  }).join('') + '</div>';
}

function question(){
  foot.hidden = true;
  const q = Q[i];
  app.innerHTML = bar() + `
    <div class="card">
      <div class="qn">Statement ${i+1} of ${Q.length}</div>
      <div class="claim">${q.c}</div>
      <div class="choices">
        <button class="choice" data-a="myth">That's a myth</button>
        <button class="choice" data-a="real">That's real</button>
      </div>
      <div class="kbd">Press 1 for myth, 2 for real</div>
    </div>`;
  app.querySelectorAll('.choice').forEach(b=>{
    b.onclick = () => answer(b.dataset.a === 'myth');
  });
  toets = (e) => {
    if (e.key === '1') answer(true);
    else if (e.key === '2') answer(false);
  };
  meldHoogte();
}

function answer(saidMyth){
  const q = Q[i];
  const right = (saidMyth === q.myth);
  results[i] = right;
  answers[i] = saidMyth;
  const card = app.querySelector('.card');
  app.querySelector('.choices').remove();
  const hint = app.querySelector('.kbd'); if (hint) hint.remove();
  card.insertAdjacentHTML('beforeend', `
    <div class="reveal">
      <span class="verdict ${right?'ok':'no'}">${right?'You were right':'You were wrong'}</span>
      <div class="truth">VERDICT: ${q.truth}</div>
      <p class="expl">${q.e}</p>
      <div class="srcline">Source: <a href="${q.u}" target="_blank" rel="noopener">${q.s}</a></div>
      ${q.yt ? `<div><a class="watch" href="https://www.youtube.com/watch?v=${q.yt}" target="_blank" rel="noopener">▶ Watch the episode · ${q.ytt}</a></div>` : ''}
      <button class="next" id="nx">${i === Q.length-1 ? 'See your score' : 'Next statement'}</button>
    </div>`);
  app.querySelector('.bar').replaceWith(document.createRange().createContextualFragment(bar()).firstChild);
  const verder = () => { i++; (i < Q.length) ? question() : result(); };
  document.getElementById('nx').onclick = verder;
  toets = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); verder(); } };
  meldHoogte();
}

function telling(){
  let goed = 0, mythesGeloofd = 0, waarhedenAfgewezen = 0;
  Q.forEach((q, n) => {
    const zeiMythe = answers[n];
    if (zeiMythe === undefined) return;
    if (zeiMythe === q.myth) goed++;
    else if (q.myth) mythesGeloofd++;        // het was een mythe, zij zeiden "echt"
    else waarhedenAfgewezen++;               // het was waar, zij zeiden "mythe"
  });
  return {goed, mythesGeloofd, waarhedenAfgewezen};
}

function oordeelTekst(t){
  const {goed, mythesGeloofd: m, waarhedenAfgewezen: w} = t;
  const fout = m + w;
  if (fout === 0)
    return "Ten out of ten. Either you already knew them, or you spotted the two that are true — and almost nobody spots those.";
  if (m === 0)
    return w === 1
      ? "You spotted every myth, but one surprising truth got called a myth as well."
      : `You spotted every myth, but missed ${WOORD[w]} surprising truths.`;
  if (w === 0)
    return m === 1
      ? "You caught both true stories and only let one myth through. That is a rare combination."
      : `You caught both true stories, but ${WOORD[m]} myths still got past you.`;
  if (fout >= 8)
    return "Almost every one landed the wrong way round. That is not stupidity — it is what repetition does to a claim.";
  if (fout >= 5)
    return `${hoofdletter(WOORD[m])} myths got past you and ${WOORD[w]} true ${w === 1 ? 'story was' : 'stories were'} written off. Both halves catch people, for opposite reasons.`;
  return `${hoofdletter(WOORD[m])} ${m === 1 ? 'myth' : 'myths'} got past you, and ${WOORD[w]} true ${w === 1 ? 'story' : 'stories'} got written off as ${w === 1 ? 'a myth' : 'myths'}.`;
}

// Op de echte site delen we altijd het canonieke adres. Staat de pagina ergens anders
// (een preview, een kopie), dan wijst de deellink naar diezelfde plek, zodat hij blijft werken.
const DEELBASIS = location.hostname.endsWith('ogsmysterylab.github.io')
  ? TEST : (location.origin + location.pathname);

function deelTekst(goed){
  const link = DEELBASIS + '?s=' + goed;
  return {
    tekst: `I scored ${goed}/${Q.length} on the OGS Mystery Lab myth test. Can you beat me? Take the 2-minute challenge: ${link}`,
    link
  };
}

function result(){
  const t = telling();
  const grid = results.map(r => r ? '🟩' : '🟥').join('');
  const {tekst: deelbaar, link: deellink} = deelTekst(t.goed);

  foot.hidden = false;
  toets = null;
  if (window.goatcounter && window.goatcounter.count) {
    window.goatcounter.count({path: 'test-score-' + t.goed, title: 'Test finished', event: true});
  }

  const rij = (n) => {
    const q = Q[n];
    const label = q.myth ? 'You believed this one' : 'You called this a myth';
    return `<div class="r"><span class="dot">🟥</span><span class="t">
      <b>${q.c}</b><br>
      <span class="bd miss" style="display:inline-block;margin:6px 0 2px">${label}</span><br>
      ${q.truth} — ${q.e}
      <a href="${q.u}" target="_blank" rel="noopener">source</a>${q.yt ? ` · <a href="https://www.youtube.com/watch?v=${q.yt}" target="_blank" rel="noopener">watch the episode</a>` : ''}
    </span></div>`;
  };

  app.innerHTML = `
    <div class="qn">Your result</div>
    <div class="score"><em>${t.goed}</em>/${Q.length} correct</div>
    <div class="breakdown">
      <span class="bd ${t.mythesGeloofd ? 'miss' : 'good'}">Myths you believed: <b>${t.mythesGeloofd}</b></span>
      <span class="bd ${t.waarhedenAfgewezen ? 'miss' : 'good'}">True stories you dismissed: <b>${t.waarhedenAfgewezen}</b></span>
    </div>
    <p class="verdicttxt">${oordeelTekst(t)}</p>
    <div class="grid">${grid}</div>
    <span class="note">🟩 right · 🟥 wrong</span>
    <div class="actions">
      <button class="ghost" id="share" aria-expanded="false" aria-controls="sharebox">Share your result</button>
      <button class="ghost" id="again">Try again</button>
      <a class="ghost" href="${SITE}" target="_blank" rel="noopener">See all the sources</a>
    </div>
    <div class="sharebox" id="sharebox" hidden>
      <div class="sharetxt" id="sharetxt"></div>
      <div class="shareopts">
        <button class="sopt" id="s-native" hidden>Share&hellip;</button>
        <a class="sopt wa" id="s-wa" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 1 1-4.2 15.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.8zm-3.2 4c-.2 0-.5 0-.7.4-.2.4-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.7 2.8 4.3 3.8 2.1.8 2.6.7 3 .6.5 0 1.4-.6 1.6-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.5-.3l-1.6-.8c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.5l.4-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5l-.7-1.7c-.2-.4-.4-.4-.6-.4h-.2z"/></svg>
          WhatsApp
        </a>
        <button class="sopt" id="s-copy">Copy link</button>
      </div>
      <p class="livemsg" id="livemsg" role="status" aria-live="polite"></p>
    </div>
    <div class="recap">
      <h3>${t.goed === Q.length ? 'Nothing got past you' : 'What you got wrong'}</h3>
      ${results.map((r, n) => r ? '' : rij(n)).join('') ||
        '<div class="r"><span class="dot">🟩</span><span class="t">All ten correct — both the eight myths and the two true stories.</span></div>'}
    </div>
    ${socialsHTML('More from OGS Mystery Lab')}`;

  document.getElementById('again').onclick = () => { i = 0; results = []; answers = []; intro(); };

  const knop   = document.getElementById('share');
  const doos   = document.getElementById('sharebox');
  const melder = document.getElementById('livemsg');
  document.getElementById('sharetxt').textContent = deelbaar;
  document.getElementById('s-wa').href = 'https://wa.me/?text=' + encodeURIComponent(deelbaar);

  const zegHet = (m) => { melder.textContent = m; clearTimeout(zegHet._t); zegHet._t = setTimeout(() => { melder.textContent = ''; meldHoogte(); }, 4000); };

  const nativeKnop = document.getElementById('s-native');
  if (navigator.share) {
    nativeKnop.hidden = false;
    nativeKnop.onclick = async () => {
      try {
        await navigator.share({title: 'OGS Mystery Lab — myth test', text: deelbaar, url: deellink});
        zegHet('Shared.');
      } catch (err) {
        // Annuleren is geen fout: de gebruiker bedacht zich, dus geen melding.
        if (!(err && (err.name === 'AbortError' || err.name === 'NotAllowedError'))) {
          zegHet('Sharing did not open. Use WhatsApp or Copy link instead.');
        }
      }
      meldHoogte();
    };
  }

  const naarKlembord = async (waarde) => {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(waarde); return true; }
    } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = waarde; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  };

  const kopieerKnop = document.getElementById('s-copy');
  kopieerKnop.onclick = async () => {
    // let op: e.currentTarget is na de eerste await null, dus we pakken de knop uit de scope
    const ok = await naarKlembord(deelbaar);
    if (ok) {
      kopieerKnop.textContent = 'Copied';
      zegHet('Copied. The link opens a fresh test for whoever you send it to.');
      clearTimeout(kopieerKnop._t);
      kopieerKnop._t = setTimeout(() => { kopieerKnop.textContent = 'Copy link'; }, 2500);
    } else {
      zegHet('Could not copy automatically — select the text above and copy it.');
    }
    meldHoogte();
  };

  knop.onclick = () => {
    const open = doos.hidden;
    doos.hidden = !open;
    knop.setAttribute('aria-expanded', String(open));
    knop.textContent = open ? 'Close sharing' : 'Share your result';
    if (open) (document.getElementById('s-native').hidden ? document.getElementById('s-wa') : nativeKnop).focus();
    meldHoogte();
  };

  toets = (e) => {
    if (e.key === 'Escape' && !doos.hidden) { knop.click(); knop.focus(); }
  };

  meldHoogte();
}

intro();
window.addEventListener('resize', meldHoogte);
</script>

<script data-goatcounter="https://ogsmysterylab.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
